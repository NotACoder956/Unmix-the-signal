[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unmix-signal-ica"
version = "1.0.0"
description = "Audio source separation with PCA whitening and a from-scratch FastICA implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
